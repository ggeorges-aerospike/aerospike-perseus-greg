aerospikeConfiguration:
  hosts:
    -
      ip: "localhost"
      port: 3000
  username: "s"
  password: ""
  namespace: "test"
  set: "bluesky_events"
  truncateSet: True
  tlsPath: ""
outputWindowConfiguration:
  printIntervalSec: 1
  numberOfLinesBeforeReprintingTheHeader: 25
  columnWidth: 11
testConfiguration:
